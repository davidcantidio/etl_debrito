[tool.poetry]
name = "etl-debrito"
version = "0.1.0"
description = "ETL de dados e módulo ponto_de_controle"
authors = ["Seu Nome <seu@email.com>"]

# lista explícita dos diretórios-módulo que fazem parte do projeto
packages = [
  { include = "ponto_de_controle" },
  { include = "extract" },
  { include = "load" },
  { include = "treat" }
]

[tool.poetry.dependencies]
python  = "^3.12,<3.13"
pandas  = "2.2.3"    # compatível com NumPy 2
numpy   = "2.2.5"
python-dotenv = "1.1.0"
