# .github/workflows/ci.yml
name: CI

on:
  push:
  pull_request:

jobs:
  # === Setup & cache the project dependencies ===
  setup:
    name: ♻️ Setup & Cache Dependencies
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache-deps.outputs.cache-hit }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ♻️ Cache pip deps
        id: cache-deps
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 📦 Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  # === Linting: flake8, isort, black ===
  lint:
    name: 🧹 Code Linting
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ♻️ Restore pip cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 📦 Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 isort black

      - name: 🔍 flake8 (PEP8 + unused imports)
        run: |
          flake8 . \
            --exclude=venv,env,.venv,__pycache__,*.pyc

      - name: 🔀 isort (import order)
        run: |
          isort . \
            --check-only \
            --diff \
            --skip=venv \
            --skip=env \
            --skip=.venv

      - name: 🎨 black (formatting)
        run: |
          black --check . \
            --exclude '(venv|env|\.venv|__pycache__|\.ipynb_checkpoints)'
