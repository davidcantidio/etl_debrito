# .github/workflows/ci.yml
name: CI

on:
  push:
  pull_request:

jobs:
  # === Setup & cache the project dependencies ===
  setup:
    name: ♻️ Setup & Cache Dependencies
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache-deps.outputs.cache-hit }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📥 Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: ♻️ Cache Poetry deps
        id: cache-deps
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: 📦 Install project dependencies
        run: poetry install --no-dev
  lint:
    name: 🧹 Code Linting
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📥 Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: ♻️ Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: 📦 Install linters
        run: poetry install --only dev

      - name: 🧪 Run flake8 (errors only)
        run: |
          poetry run flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: 📦 Check import order (isort)
        run: poetry run isort . --check-only --diff --skip=venv --skip=env

      - name: 🎨 Check formatting (black)
        run: poetry run black --check . --exclude '(venv|env|__pycache__|\.ipynb_checkpoints)'
