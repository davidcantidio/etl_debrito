# .github/workflows/ci.yml
name: CI

# Dispara em push ou pull_request para qualquer branch
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  # Job de instalação e cache de dependências
  setup:
    name: ♻️ Setup & Cache Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ♻️ Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 📦 Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  # Job de linting: flake8, isort e black
  lint:
    name: 🧹 Code Linting
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ♻️ Restore pip cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 📦 Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 isort black

      - name: 🔍 Run flake8
        run: |
          # Exclui virtual-envs e cache de bytecode
          flake8 . \
            --exclude=venv,env,.venv,__pycache__,**/*.pyc \
            --extend-exclude=".github,tests/data"

      - name: 🔀 Check import order with isort
        run: |
          # --check-only: falha se precisar ordenar
          # --skip: ignora virtual-envs
          isort . \
            --check-only \
            --diff \
            --skip=venv \
            --skip=env \
            --skip=.venv

      - name: 🎨 Check formatting with black
        run: |
          # --check: falha se encontrar alterações
          # exclui notebooks e virtual-envs
          black --check . \
            --exclude '(venv|env|\.venv|__pycache__|\.ipynb_checkpoints)'
