name: 📘 Notebook Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-notebooks:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout do repositório
      uses: actions/checkout@v3

    - name: 🐍 Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 📦 Instalar dependências do projeto
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install nbval  # validação de notebooks com pytest

    - name: ✅ Validar notebooks com nbval
      run: |
        # Executa validação com nbval para notebooks na raiz do projeto
        # Ignora subpastas como venv/, env/, etc.
        pytest --nbval --ignore=venv --ignore=env .
